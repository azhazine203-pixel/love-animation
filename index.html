
<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>I Love You ❤️</title>
<style>
* { box-sizing: border-box; }

body {
  margin: 0;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  overflow: hidden;
  background: #080008;
  color: #ff1744;
  font-family: monospace;
}

h2 {
  text-shadow: 0 0 15px red;
  margin-bottom: 25px;
}

.scene {
  width: 320px;
  height: 300px;
  perspective: 700px;
}

.heart {
  width: 100%;
  height: 100%;
  position: relative;
  transform-style: preserve-3d;
  animation: spin 7s linear infinite;
}

.word {
  position: absolute;
  left: 50%;
  top: 50%;
  font-size: 11px;
  font-weight: bold;
  white-space: nowrap;
  text-shadow: 0 0 8px red;
  transform: translate(-50%, -50%);
}

@keyframes spin {
  from { transform: rotateY(0deg) rotateX(8deg); }
  to   { transform: rotateY(360deg) rotateX(8deg); }
}

p {
  color: #ff9aaf;
  text-align: center;
  padding: 12px;
}
</style>
</head>
<body>

<h2>❤️ I LOVE YOU ❤️</h2>
<div class="scene">
  <div class="heart" id="heart"></div>
</div>
<p>Made with love ❤️</p>

<script>
const heart = document.getElementById("heart");

for (let i = 0; i < 240; i++) {
  const t = Math.random() * Math.PI * 2;
  const scale = Math.sqrt(Math.random());
  const x = 16 * Math.pow(Math.sin(t), 3) * scale;
  const y = (
    13 * Math.cos(t)
    - 5 * Math.cos(2*t)
    - 2 * Math.cos(3*t)
    - Math.cos(4*t)
  ) * scale;

  const z = (Math.random() - 0.5) * 100;
  const word = document.createElement("span");

  word.className = "word";
  word.textContent = "I LOVE YOU ♥";
  word.style.left = `calc(50% + ${x * 7}px)`;
  word.style.top = `calc(50% - ${y * 7}px)`;
  word.style.transform =
    `translate(-50%, -50%) translateZ(${z}px)`;

  heart.appendChild(word);
}
</script>

</body>
</html>
